<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Projects</title>
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        font-family: Arial, Helvetica, sans-serif;
        background: #f5f7fa;
        color: #333;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 40px 20px;
    }

    .container {
        width: 100%;
        max-width: 500px;
        background: #fff;
        border-radius: 12px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, .08);
        padding: 35px;
    }

    h1 {
        text-align: center;
        margin-bottom: 8px;
        font-size: 2rem;
    }

    p {
        text-align: center;
        color: #666;
        margin-bottom: 30px;
    }

    ul {
        list-style: none;
    }

    li+li {
        margin-top: 12px;
    }

    a {
        display: flex;
        align-items: center;
        gap: 12px;
        text-decoration: none;
        color: #333;
        background: #f8f9fb;
        padding: 14px 18px;
        border-radius: 8px;
        border: 1px solid #e5e7eb;
        transition: all .2s ease;
        font-weight: 600;
    }

    a i {
        width: 22px;
        font-size: 1.15rem;
        text-align: center;
    }

    a:hover {
        background: #7952b3;
        color: #fff;
        transform: translateX(5px);
    }
    </style>
</head>

<body>
    <div class="container">
        <h1>Bootstrap Projects</h1>
        <p>Explore my Bootstrap-based web projects</p>
        <ul>
            <li><a href="splyt">🚕 Splyt</a></li>
            <li><a href="boomerang">🔄 Boomerang</a></li>
            <li><a href="hello-d">👋 Hello-D</a></li>
            <li><a href="rapidfix">🛠️ RapidFix</a></li>
            <li><a href="ultrazaim">🏗️ ultrazaim</a></li>
            <li><a href="wedding-advisor">💍 Wedding Advisor</a></li>
        </ul>
    </div>
</body>

</html>
